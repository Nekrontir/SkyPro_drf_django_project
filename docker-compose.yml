services:
  db:
    image: postgres:16
    container_name: skypro_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${NAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  redis:
    image: redis:7
    container_name: skypro_redis
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  web:
    build: .
    container_name: skypro_web
    entrypoint: /entrypoint.sh
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    restart: always

  celery_worker:
    build: .
    container_name: skypro_celery_worker
    command: celery -A config worker -l info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    restart: always

  celery_beat:
    build: .
    container_name: skypro_celery_beat
    command: celery -A config beat -l info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    restart: always

volumes:
  postgres_data:
  redis_data: